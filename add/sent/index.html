<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f6f8">
<title>Thank you · Tezberemo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* V1 · Open page. A white sheet with the paper plane on the light page. */
  :root {
    --page: #f4f6f8;
    --paper: #ffffff;
    --ink: #15181c;
    --ink-2: #5b6068;
    --rule: rgba(21, 24, 28, .10);
    --gutter: 16px;
    --body: "Inter", system-ui, sans-serif;
    --display: "Inter Tight", "Inter", system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: var(--page); color: var(--ink); font: 400 17px/1.5 var(--body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; }
  a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; border-radius: 6px; }
  .wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 var(--gutter); }
  @media (min-width: 720px) { :root { --gutter: 40px; } }

  .nav {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255, 255, 255, .7);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
            backdrop-filter: blur(20px) saturate(140%);
    border-bottom: 1px solid var(--rule);
  }
  .nav-in { display: flex; align-items: center; min-height: 64px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; font: 700 17px/1 var(--display); letter-spacing: -.02em; text-decoration: none; }
  .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); display: grid; place-items: center; }
  .mark svg { width: 16px; height: 16px; }

  main.wrap { padding-top: 32px; padding-bottom: 56px; }
  @media (min-width: 720px) { main.wrap { padding-top: 96px; padding-bottom: 120px; } }
  .sheet {
    max-width: 38rem; margin: 0 auto; background: var(--paper); border-radius: 24px;
    border: 1px solid var(--rule); box-shadow: 0 1px 2px rgba(21,24,28,.05), 0 24px 60px -24px rgba(21,24,28,.22);
    padding: 40px 22px 24px; text-align: center;
  }
  @media (min-width: 600px) { .sheet { padding: 60px 64px 36px; } }

  .draw { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .draw .acc { stroke-width: 2.2; }
  .draw .fill { fill: var(--paper); }
  .draw .dash { stroke: #9aa0a6; stroke-dasharray: 1 5; }
  .art { width: 148px; height: 112px; display: block; margin: 0 auto 26px; }
  .art .plane { animation: drift 6s ease-in-out infinite; transform-origin: 98px 52px; }
  @keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(3px, -4px); } }

  h1 { margin: 0 0 16px; font: 700 2.1rem/1.05 var(--display); letter-spacing: -.04em; text-wrap: balance; }
  @media (min-width: 600px) { h1 { font-size: 2.75rem; } }
  p { margin: 0 auto 12px; max-width: 30rem; }
  .muted { color: var(--ink-2); }
  .back {
    display: flex; align-items: center; justify-content: center; min-height: 48px;
    margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--rule);
    font-weight: 600; color: var(--ink); text-underline-offset: 4px;
  }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  *, *::before, *::after { animation: none !important; }
</style>
</head>
<body>

<header class="nav">
  <div class="wrap nav-in">
    <a class="brand" href="../../">
      <span class="mark"><svg viewBox="0 0 16 16" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 2h6l3 3v9h-9z"/><path d="M6 8h4.5M6 10.5h3"/></svg></span>
      Tezberemo
    </a>
  </div>
</header>

<main class="wrap">
  <div class="sheet">
    <svg class="art draw" viewBox="0 0 148 112" aria-hidden="true">
      <path class="dash" d="M12 96c18-4 30-14 40-26s20-22 34-26"/>
      <g class="plane">
        <path class="fill" d="M138 14 58 46l24 10z"/>
        <path class="fill" d="M138 14 82 56l14 34z"/>
        <path d="M82 56 74 76l8-6"/>
        <path class="acc" d="M138 14 82 56"/>
      </g>
    </svg>
    <h1>We have it. Thank you.</h1>
    <p>A person on our team will read what you sent and write to your email: whether we can make this Instruction, and what else we need.</p>
    <p class="muted">We are a small team and make each Instruction by hand, so we can't promise a date.</p>
    <a class="back" href="../../">← All instructions</a>
  </div>
</main>
</body>
</html>
